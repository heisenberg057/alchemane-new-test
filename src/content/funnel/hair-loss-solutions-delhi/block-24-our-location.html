<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap');
  .location-section-main {
    max-width: 450px;
    margin: 0 auto;
    padding: 32px 20px;
    font-family: 'Montserrat', sans-serif;
    background: #FFF;
    text-align: center;
    position: relative;
  }
  .location-title-main {
    font-size: 24px;
    font-family: Montserrat;
    font-weight: 800;
    color: #191919;
    margin-bottom: 24px;
    line-height: 130%;
  }
  /* Carousel Container - EXACTLY like Working Carousels */
  .location-carousel-wrapper-main {
    position: relative;
    width: 100%;
    margin-bottom: 24px;
  }
  .location-container-main {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    gap: 20px;
    padding: 8px 10px 8px 10px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    border-radius: 12px;
  }
  .location-container-main::-webkit-scrollbar {
    display: none;
  }
  .location-slide-main {
    flex: 0 0 auto;
    min-width: 88%;
    flex-shrink: 0;
    position: relative;
    scroll-snap-align: start;
    border-radius: 12px;
  }
  .location-slide-main img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
  }
  /* Dots - Same as Working Carousels */
  .location-dots-main {
    display: flex;
    justify-content: center;
    margin: 30px 0 29px 0;
    gap: 8px;
  }
  .location-dot-main {
    width: 8px;
    height: 8px;
    background-color: #ccc;
    border-radius: 50%;
    cursor: pointer;
    display: inline-block;
    transition: background-color 0.3s ease;
  }
  .location-dot-main.active {
    background-color: #333;
  }
  /* Arrows - Same as Working Carousels */
  .location-arrow-left-main {
    position: absolute;
    top: 50%;
    left: 10px;
    transform: translateY(-50%);
    z-index: 5;
    width: 40px;
    height: 40px;
    background: #F0F4FF;
    border-radius: 50%;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
  }
  .location-arrow-right-main {
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
    z-index: 5;
    width: 40px;
    height: 40px;
    background: #F0F4FF;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
  }
  .location-arrow-right-main svg {
    transform: rotate(0deg);
  }
  /* Arrow hover effects */
  .location-arrow-left-main:hover,
  .location-arrow-right-main:hover {
    background: #E5EDFF;
  }
  .location-address-main {
    font-size: 16px;
    font-weight: 400;
    color: #191919;
    text-align: left;
    font-family: Roboto;
    margin-top: 16px;
    padding: 0 4px;
    line-height: 150%;
  }
  .location-address-main strong {
    display: block;
    font-family: Roboto;
    font-size: 18px;
    font-weight: 700;
    line-height: 24px;
    margin-bottom: 4px;
  }
</style>
