<div id="nh-video-modal"
     style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9); overflow: auto;">

<style>
  .nh-video-card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .nh-video-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
  }
  .nh-video-card.blurred .nh-video-thumb {
    filter: blur(8px);
    transition: filter 0.5s ease;
  }
  .nh-video-card.blurred .nh-overlay {
    opacity: 1 !important;
    pointer-events: auto !important;
  }
  #nh-video-modal {
    backdrop-filter: blur(4px);
  }
  #nh-close:hover,
  #nh-close:focus {
    color: #bbb;
    transform: scale(1.1);
    transition: all 0.2s ease;
  }
  @media (max-width: 480px) {
    #nh-video-modal>div {
      margin: 10% auto;
      width: 95%;
      padding: 10px;
    }
  }
</style>
