<!-- CSS Styles -->
<style>
  /* Image card hover and transition effects */
  .custom-image-card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .custom-image-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
  }
  /* Blur effect when class is added */
  .custom-image-card.blurred .custom-image-thumb {
    filter: blur(8px);
    transition: filter 0.5s ease;
  }
  .custom-image-card.blurred .custom-image-overlay {
    opacity: 1 !important;
    pointer-events: auto !important;
  }
  /* Modal styling improvements */
  #custom-image-modal {
    backdrop-filter: blur(4px);
  }
  #custom-modal-close:hover,
  #custom-modal-close:focus {
    color: #bbb;
    transform: scale(1.1);
    transition: all 0.2s ease;
  }
  /* Responsive modal adjustments */
  @media (max-width: 480px) {
    #custom-image-modal > div {
      margin: 10% auto;
      width: 95%;
      padding: 10px;
    }
  }
</style>
