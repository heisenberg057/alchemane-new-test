map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── HTTP → HTTPS (apex + www) ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name americanhairline.com www.americanhairline.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://americanhairline.com$request_uri;
    }
}

# Legacy staging host (HTTP only — no TLS cert required on the new VPS)
server {
    listen 80;
    listen [::]:80;
    server_name new.americanhairline.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://americanhairline.com$request_uri;
    }
}

# WWW HTTPS → apex (same cert as apex; include www in certbot -d list)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.americanhairline.com;

    ssl_certificate     /etc/letsencrypt/live/americanhairline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/americanhairline.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://americanhairline.com$request_uri;
}

# Primary HTTPS apex
# certbot certonly --webroot -w /var/www/certbot -d americanhairline.com -d www.americanhairline.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name americanhairline.com;

    ssl_certificate     /etc/letsencrypt/live/americanhairline.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/americanhairline.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_cache_bypass                 $http_upgrade;

    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffer_size     16k;
    proxy_buffers         8 16k;
    proxy_busy_buffers_size 32k;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    location /_next/static/ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/(favicon|apple-touch-icon|android-chrome|site\.webmanifest) {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://web:3000;
    }
}

# Default catch-all (IP / unknown hosts) for bootstrap before DNS cutover
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
